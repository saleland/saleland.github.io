<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부동산 급매물 정보 플랫폼 - saleland.github.io</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; }
        @media print {
            body { background: white !important; }
            .no-print { display: none !important; }
            .print-container { box-shadow: none !important; margin: 0 !important; width: 100% !important; max-width: none !important; }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-slate-900 text-white shadow-md py-4 px-6 flex justify-between items-center no-print">
        <div class="flex items-center space-x-3 cursor-pointer" onclick="switchView('list')">
            <svg class="w-8 h-8 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"/></svg>
            <div>
                <h1 class="text-xl font-black tracking-tight text-emerald-400">saleland.github.io</h1>
                <p class="text-[10px] text-slate-400">부동산 급매물 전문 정보 플랫폼 (방문자 전용)</p>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto p-4 md:p-6">
        
        <!-- View 1: Public Property List Page -->
        <div id="view-list" class="space-y-6">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
                <div>
                    <h2 class="text-xl font-black text-slate-900">추천 급매물 정보 목록</h2>
                    <p class="text-xs text-slate-500 mt-1">엄선된 알짜배기 부동산 급매물 및 토지 정보를 한눈에 확인하고 PDF 제안서로 출력하세요.</p>
                </div>
                <div class="flex items-center space-x-2 w-full md:w-auto">
                    <input type="text" id="search-input" placeholder="지역 또는 제목 검색..." oninput="filterProperties()" class="px-3 py-2 text-sm border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none w-full md:w-64">
                </div>
            </div>

            <div id="property-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Dynamically populated via JS -->
            </div>
        </div>

        <!-- View 2: Detailed Brochure / PDF View -->
        <div id="view-detail" class="hidden flex flex-col items-center space-y-6">
            <div class="w-full max-w-[210mm] flex justify-between items-center no-print bg-white p-3 rounded-xl shadow-sm border border-slate-200">
                <button onclick="switchView('list')" class="text-xs font-bold text-slate-600 hover:text-slate-900 flex items-center space-x-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
                    <span>목록으로 돌아가기</span>
                </button>
                <div class="flex items-center space-x-2">
                    <button onclick="downloadPDF()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow transition flex items-center space-x-1">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                        <span>PDF 출력 / 다운로드</span>
                    </button>
                </div>
            </div>

            <div id="brochure" class="print-container bg-white w-full max-w-[210mm] min-h-[297mm] max-h-[297mm] p-6 md:p-8 shadow-xl rounded-xl border border-slate-200 flex flex-col justify-between relative box-border overflow-hidden">
                <div>
                    <div class="flex justify-between items-start border-b-2 border-emerald-600 pb-3 mb-3">
                        <div>
                            <span class="inline-block bg-emerald-100 text-emerald-800 text-[10px] font-bold px-2 py-0.5 rounded mb-1">SALELAND.GITHUB.IO BROCHURE</span>
                            <h2 id="preview-title" class="text-xl font-black text-slate-900 tracking-tight"></h2>
                        </div>
                        <div class="text-right">
                            <span class="text-[10px] font-semibold text-slate-400 block">매물관리번호</span>
                            <span id="preview-serial" class="text-xs font-bold text-slate-700"></span>
                        </div>
                    </div>

                    <!-- 3 Image Grid Showcase -->
                    <div class="grid grid-cols-3 gap-2.5 mb-2.5">
                        <div class="col-span-2 h-40 bg-slate-100 rounded-lg overflow-hidden border border-slate-200 relative">
                            <img id="preview-img-1" src="" alt="메인 사진" class="w-full h-full object-cover">
                            <span class="absolute bottom-1.5 left-1.5 bg-black/60 text-white text-[9px] px-1.5 py-0.5 rounded">전경 및 조망</span>
                        </div>
                        <div class="flex flex-col gap-2">
                            <div class="h-[76px] bg-slate-100 rounded-lg overflow-hidden border border-slate-200 relative">
                                <img id="preview-img-2" src="" alt="사진 2" class="w-full h-full object-cover">
                                <span class="absolute bottom-1 left-1 bg-black/60 text-white text-[8px] px-1 py-0.2 rounded">진입로</span>
                            </div>
                            <div class="h-[76px] bg-slate-100 rounded-lg overflow-hidden border border-slate-200 relative">
                                <img id="preview-img-3" src="" alt="사진 3" class="w-full h-full object-cover">
                                <span class="absolute bottom-1 left-1 bg-black/60 text-white text-[8px] px-1 py-0.2 rounded">주변환경</span>
                            </div>
                        </div>
                    </div>

                    <!-- Property Details Cards -->
                    <div class="bg-slate-50 rounded-lg p-2.5 border border-slate-200 mb-2 space-y-1.5">
                        <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wide flex items-center space-x-1.5">
                            <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            <span>핵심 매물 정보</span>
                        </h3>
                        <div class="grid grid-cols-2 gap-2 text-xs">
                            <div class="flex flex-col border-b border-slate-200 pb-1">
                                <span class="text-[10px] text-slate-500 font-medium">소재지 (지번)</span>
                                <span id="preview-address" class="font-semibold text-slate-800 mt-0.5 truncate"></span>
                            </div>
                            <div class="flex flex-col border-b border-slate-200 pb-1">
                                <span class="text-[10px] text-slate-500 font-medium">면적</span>
                                <span id="preview-area" class="font-semibold text-slate-800 mt-0.5"></span>
                            </div>
                            <div class="flex flex-col border-b border-slate-200 pb-1">
                                <span class="text-[10px] text-slate-500 font-medium">매매가</span>
                                <span id="preview-price" class="font-bold text-emerald-600 text-sm mt-0.5"></span>
                            </div>
                            <div class="flex flex-col border-b border-slate-200 pb-1">
                                <span class="text-[10px] text-slate-500 font-medium">용도지역 / 지목</span>
                                <span id="preview-zone" class="font-semibold text-slate-800 mt-0.5"></span>
                            </div>
                        </div>
                    </div>

                    <!-- Features Section -->
                    <div class="mb-2">
                        <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wide mb-1 flex items-center space-x-1.5">
                            <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            <span>상세 특징 및 기타 사항</span>
                        </h3>
                        <div class="bg-white border border-slate-200 rounded-lg px-3 py-1.5 text-xs text-slate-700 truncate" id="preview-features"></div>
                    </div>

                    <!-- Location Condition Map Section -->
                    <div class="mb-1">
                        <h3 class="text-xs font-bold text-slate-900 uppercase tracking-wide mb-1 flex items-center space-x-1.5">
                            <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                            <span>입지조건 및 위치도</span>
                        </h3>
                        <div class="h-44 bg-slate-100 rounded-lg overflow-hidden border border-slate-200 relative">
                            <img id="preview-img-4" src="" alt="입지조건 사진" class="w-full h-full object-cover">
                            <span class="absolute bottom-1.5 left-1.5 bg-black/60 text-white text-[9px] px-1.5 py-0.5 rounded">주변 입지 및 접근성 안내</span>
                        </div>
                    </div>
                </div>

                <!-- Footer -->
                <div class="border-t border-slate-200 pt-1.5 mt-1 flex justify-between items-center text-[11px] text-slate-500">
                    <div id="preview-agent" class="font-bold text-slate-700 truncate"></div>
                    <div class="shrink-0 ml-2"><span>PAGE 1 / 1</span></div>
                </div>
            </div>

            <div class="w-full max-w-[210mm] bg-white p-6 rounded-xl shadow-sm border border-slate-200 no-print space-y-4">
                <h3 class="text-sm font-bold text-slate-900 flex items-center space-x-2">
                    <span>💬 방문자 문의 및 답글 남기기</span>
                </h3>
                
                <div class="space-y-3">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        <input type="text" id="comment-author" placeholder="작성자 이름" class="px-3 py-2 text-xs border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                        <input type="password" id="comment-password" placeholder="비밀번호 (수정/삭제용)" class="px-3 py-2 text-xs border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                    </div>
                    <textarea id="comment-content" rows="3" placeholder="매물에 대한 문의사항이나 답변을 남겨주세요..." class="w-full px-3 py-2 text-xs border rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none"></textarea>
                    <div class="flex justify-end">
                        <button onclick="submitVisitorComment()" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2 rounded-lg text-xs font-bold transition shadow">
                            답글 등록하기
                        </button>
                    </div>
                </div>

                <div class="border-t pt-4 space-y-2">
                    <h4 class="text-xs font-bold text-slate-700">등록된 답글 목록 (<span id="comment-count">0</span>건)</h4>
                    <div id="comments-list" class="space-y-2 max-h-48 overflow-y-auto">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </div>

    </main>

    <script>
        let properties = [
            {
                id: 'prop-1',
                title: '[급매] 친환경 전원주택/농가주택지 매매',
                serial: '01',
                discount: 'SALE 20%',
                area: '660㎡ (약 200평)',
                address: '경기도 양평군 서종면 문호리 산 12-3',
                price: '3억 5,000만 원',
                zone: '계획관리지역 / 대지 및 전',
                features: '북한강 조망권 우수, 정남향 배치, 2차선 도로 접해 진출입 용이, 즉시 건축 가능',
                agent: '랜드세일마트 | 대표: 김철수 | 📞 010-1234-5678',
                img1: 'https://placehold.co/600x400/e2e8f0/64748b?text=Main+Photo',
                img2: 'https://placehold.co/400x300/e2e8f0/64748b?text=Photo+2',
                img3: 'https://placehold.co/400x300/e2e8f0/64748b?text=Photo+3',
                img4: 'https://placehold.co/800x450/e2e8f0/64748b?text=Location+Map',
                comments: []
            },
            {
                id: 'prop-2',
                title: '[추천] 역세권 상업용 나대지 토지 급매',
                serial: '02',
                discount: 'SALE 15%',
                area: '990㎡ (약 300평)',
                address: '경기도 가평군 가평읍 대곡리 456-1',
                price: '7억 2,000만 원',
                zone: '일반상업지역 / 대지',
                features: '가평역 도보 5분 거리, 코너각지 위치하여 상가 및 사옥 부지로 최적',
                agent: '랜드세일마트 | 대표: 김철수 | 📞 010-1234-5678',
                img1: 'https://placehold.co/600x400/cbd5e1/475569?text=Commercial+Land',
                img2: 'https://placehold.co/400x300/cbd5e1/475569?text=Road+Access',
                img3: 'https://placehold.co/400x300/cbd5e1/475569?text=Surroundings',
                img4: 'https://placehold.co/800x450/cbd5e1/475569?text=Map+Location',
                comments: []
            }
        ];

        let currentActivePropertyId = null;

        function getFormattedDate() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            return `${year}-${month}-${day}`;
        }

        function switchView(viewName) {
            document.getElementById('view-list').classList.add('hidden');
            document.getElementById('view-detail').classList.add('hidden');

            if (viewName === 'list') {
                document.getElementById('view-list').classList.remove('hidden');
                renderPropertyList(properties);
            } else if (viewName === 'detail') {
                document.getElementById('view-detail').classList.remove('hidden');
            }
            window.scrollTo(0, 0);
        }

        function renderPropertyList(data) {
            const grid = document.getElementById('property-grid');
            grid.innerHTML = '';

            if (data.length === 0) {
                grid.innerHTML = `<div class="col-span-full py-12 text-center text-slate-400 text-sm">등록된 매물이 없습니다.</div>`;
                return;
            }

            data.forEach(item => {
                const discountBadge = item.discount || 'SALE 20%';
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition flex flex-col justify-between";
                card.innerHTML = `
                    <div>
                        <div class="h-48 bg-slate-100 relative overflow-hidden cursor-pointer" onclick="openDetailView('${item.id}')">
                            <img src="${item.img1}" alt="${item.title}" class="w-full h-full object-cover">
                            <span class="absolute top-3 left-3 bg-emerald-600 text-white text-[10px] font-bold px-2.5 py-1 rounded-full shadow">매물번호: ${getFormattedDate()}-${item.serial || '01'}</span>
                            <span class="absolute top-3 right-3 bg-red-600 text-white text-[10px] font-black px-2.5 py-1 rounded-full shadow animate-pulse">${discountBadge}</span>
                        </div>
                        <div class="p-5 space-y-2">
                            <h3 class="font-bold text-slate-900 text-base leading-snug line-clamp-1 cursor-pointer hover:text-emerald-600" onclick="openDetailView('${item.id}')">${item.title}</h3>
                            <p class="text-xs text-slate-500 line-clamp-1">📍 ${item.address}</p>
                            <div class="flex justify-between items-center pt-2">
                                <span class="text-xs font-medium text-slate-600">${item.area}</span>
                                <span class="text-base font-black text-emerald-600">${item.price}</span>
                            </div>
                        </div>
                    </div>
                    <div class="p-5 pt-0">
                        <button onclick="openDetailView('${item.id}')" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2 rounded-xl text-xs font-bold transition">
                            상세보기 / 답글 및 PDF 인쇄
                        </button>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterProperties() {
            const keyword = document.getElementById('search-input').value.toLowerCase();
            const filtered = properties.filter(p => p.title.toLowerCase().includes(keyword) || p.address.toLowerCase().includes(keyword));
            renderPropertyList(filtered);
        }

        function openDetailView(id) {
            const item = properties.find(p => p.id === id);
            if (!item) return;

            currentActivePropertyId = id;

            document.getElementById('preview-title').innerText = item.title;
            document.getElementById('preview-serial').innerText = `${getFormattedDate()}-${item.serial || '01'}`;
            document.getElementById('preview-address').innerText = item.address;
            document.getElementById('preview-area').innerText = item.area;
            document.getElementById('preview-price').innerText = item.price;
            document.getElementById('preview-zone').innerText = item.zone;
            document.getElementById('preview-features').innerText = item.features;
            document.getElementById('preview-agent').innerText = item.agent;

            document.getElementById('preview-img-1').src = item.img1;
            document.getElementById('preview-img-2').src = item.img2;
            document.getElementById('preview-img-3').src = item.img3;
            document.getElementById('preview-img-4').src = item.img4;

            renderComments(item.comments || []);
            switchView('detail');
        }

        function renderComments(comments) {
            const container = document.getElementById('comments-list');
            document.getElementById('comment-count').innerText = comments.length;
            container.innerHTML = '';

            if (comments.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-slate-400 text-xs">등록된 답글이 없습니다. 첫 문의를 남겨보세요!</div>`;
                return;
            }

            comments.forEach((c, idx) => {
                const box = document.createElement('div');
                box.className = "bg-slate-50 p-3 rounded-lg border border-slate-200 text-xs space-y-1";
                box.innerHTML = `
                    <div class="flex justify-between items-center text-slate-500">
                        <span class="font-bold text-slate-800">${c.author}</span>
                        <span>${c.date}</span>
                    </div>
                    <p class="text-slate-700 whitespace-pre-wrap">${c.content}</p>
                `;
                container.appendChild(box);
            });
        }

        async function submitVisitorComment() {
            const author = document.getElementById('comment-author').value.trim();
            const password = document.getElementById('comment-password').value.trim();
            const content = document.getElementById('comment-content').value.trim();

            if (!author || !content) {
                alert("작성자 이름과 내용을 모두 입력해주세요.");
                return;
            }

            const item = properties.find(p => p.id === currentActivePropertyId);
            if (!item) return;

            if (!item.comments) item.comments = [];

            const newComment = {
                id: 'comm-' + Date.now(),
                author: author,
                password: password,
                content: content,
                date: new Date().toLocaleString()
            };

            item.comments.push(newComment);
            renderComments(item.comments);

            document.getElementById('comment-author').value = '';
            document.getElementById('comment-password').value = '';
            document.getElementById('comment-content').value = '';

            // Try to simulate saving JSON to visit/ folder in GitHub if token is available locally
            const token = localStorage.getItem('gh_token');
            const owner = localStorage.getItem('gh_owner') || 'saleland';
            const repo = localStorage.getItem('gh_repo') || 'saleland.github.io';

            if (token) {
                try {
                    const filePath = `visit/comments_${item.id}.json`;
                    const jsonContent = JSON.stringify(item.comments, null, 2);
                    const base64Content = btoa(unescape(encodeURIComponent(jsonContent)));
                    
                    let sha = null;
                    const getRes = await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
                        headers: { 'Authorization': `token ${token}`, 'Accept': 'application/vnd.github.v3+json' }
                    });
                    if (getRes.ok) {
                        const fileData = await getRes.json();
                        sha = fileData.sha;
                    }

                    await fetch(`https://api.github.com/repos/${owner}/${repo}/contents/${filePath}`, {
                        method: 'PUT',
                        headers: {
                            'Authorization': `token ${token}`,
                            'Accept': 'application/vnd.github.v3+json',
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            message: `Add visitor comment for property ${item.id} in visit/ folder`,
                            content: base64Content,
                            sha: sha
                        })
                    });
                    alert("답글이 등록되었으며, 레파지토리 visit/ 폴더에 안전하게 동기화되었습니다!");
                } catch (err) {
                    console.log("GitHub API 동기화 스킵됨 (로컬 저장 반영됨):", err);
                    alert("답글이 성공적으로 등록되었습니다!");
                }
            } else {
                alert("답글이 성공적으로 등록되었습니다!");
            }
        }

        async function fetchGithubProperties() {
            try {
                const response = await fetch('./data/properties.json?t=' + new Date().getTime());
                if (response.ok) {
                    const data = await response.json();
                    if (Array.isArray(data) && data.length > 0) {
                        properties = data;
                        renderPropertyList(properties);
                    }
                }
            } catch (err) {
                console.log("로컬/원격 properties.json 파일을 불러오지 못했습니다. 기본 데이터를 사용합니다.", err);
            }
        }

        function downloadPDF() {
            const element = document.getElementById('brochure');
            const options = {
                margin:       [5, 5, 5, 5],
                filename:     '랜드세일마트_토지소개서.pdf',
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
                jsPDF:        { unit: 'mm', format: 'a4', orientation: 'portrait' }
            };
            html2pdf().from(element).set(options).save();
        }

        window.onload = async function() {
            await fetchGithubProperties();
            renderPropertyList(properties);
        };
    </script>
</body>
</html>
